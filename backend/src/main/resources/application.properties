spring.application.name=cv-analyzer-backend
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/cv_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:mySecretKey12345678901234567890123456789012}
app.jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Google OAuth2 (optional audience check; leave blank to skip aud validation)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# AI Provider
app.ai.provider=${AI_PROVIDER:openai}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.base-url=https://api.openai.com/v1
app.ai.lmstudio.base-url=${LMSTUDIO_BASE_URL:http://localhost:1234/v1}
app.ai.lmstudio.model=${LMSTUDIO_MODEL:local-model}

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
